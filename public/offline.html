<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Você está offline — Guia de Praias Ubatuba</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --ink: #0b3c5d;
        --surf: #1b8ec9;
        --sand: #fdf6ec;
        --muted: #5b7a8c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--sand);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 420px;
        background: #fff;
        border: 1px solid #e6eef3;
        border-radius: 20px;
        padding: 32px 28px;
        box-shadow: 0 12px 40px rgba(11, 60, 93, 0.1);
      }
      h1 { font-size: 1.35rem; margin: 0 0 10px; }
      p { color: var(--muted); line-height: 1.55; margin: 0 0 20px; }
      button {
        border: 0;
        border-radius: 999px;
        background: var(--surf);
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 12px 26px;
        cursor: pointer;
      }
      small { display: block; margin-top: 18px; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>📡 Sem sinal por aqui</h1>
      <p>
        Não foi possível carregar o guia agora. Se você já abriu o aplicativo, o catálogo de
        beaches e os seus salvos continuam disponíveis normalmente.
      </p>
      <button onclick="location.reload()">Tentar de novo</button>
      <small>Guia de Praias &amp; Serviços Ubatuba</small>
    </div>
  </body>
</html>
